<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>四角辯論｜學生端</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 議題設定（換議題改這個檔）與共用程式 -->
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            popIn: {
              '0%':   { opacity: '0', transform: 'translateY(24px) scale(.92)' },
              '60%':  { opacity: '1', transform: 'translateY(-4px) scale(1.02)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            toastIn: {
              '0%':   { opacity: '0', transform: 'translate(-50%, -16px) scale(.9)' },
              '100%': { opacity: '1', transform: 'translate(-50%, 0) scale(1)' },
            },
            breathe: {
              '0%,100%': { opacity: '.6' },
              '50%':     { opacity: '1' },
            },
            float: {
              '0%,100%': { transform: 'translateY(0) rotate(-4deg)' },
              '50%':     { transform: 'translateY(-10px) rotate(4deg)' },
            },
            bob: {
              '0%,100%': { transform: 'translateY(0)' },
              '50%':     { transform: 'translateY(-6px)' },
            },
          },
          animation: {
            'pop-in':   'popIn .7s cubic-bezier(.34,1.56,.64,1) both',
            'toast-in': 'toastIn .45s cubic-bezier(.34,1.56,.64,1) both',
            'breathe':  'breathe 2.4s ease-in-out infinite',
            'float':    'float 5s ease-in-out infinite',
            'bob':      'bob 2.6s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Huninn', 'Noto Sans TC', system-ui, sans-serif;
      color: #5B4B63;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(700px 500px at 10% 0%,    #F4BFCB 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 20%,  #B7D3F0 0%, transparent 60%),
        radial-gradient(700px 500px at 0% 80%,    #F5C99B 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 100%, #B5DEC6 0%, transparent 60%),
        #EAD7BC;
      background-attachment: fixed;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(#D2B48F 2px, transparent 2.5px);
      background-size: 30px 30px; opacity: .5;
    }

    /* ===== 動態島膠囊（上方四個） ===== */
    .s-island {
      background: #fff;
      border: 3px solid var(--accent);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(120, 90, 110, .18);
      transition: box-shadow .6s ease, transform .35s ease, opacity .5s ease, filter .5s ease;
    }
    .s-island:active { transform: scale(.985); }
    .hl { background: linear-gradient(transparent 62%, #FFD6A5 62%); padding: 0 .25rem; }
    .s-island.open { box-shadow: 0 12px 32px rgba(120, 90, 110, .22), 0 0 0 6px var(--accent-glow); }
    /* 已送出：其他三個島變淡，選擇的那個維持清楚 */
    .s-island.locked { opacity: .5; filter: saturate(.4); }
    .s-island.locked .head { cursor: not-allowed; }
    .s-island.locked.chosen { opacity: 1; filter: none; box-shadow: 0 0 0 6px var(--accent-glow); }
    .s-body {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .65s cubic-bezier(.22, 1, .36, 1), opacity .45s ease;
    }
    .s-island.open .s-body { grid-template-rows: 1fr; opacity: 1; }
    .s-inner { overflow: hidden; min-height: 0; }
    .s-island .chev { transition: transform .5s ease; }
    .s-island.open .chev { transform: rotate(180deg); }

    /* ===== 終極投票箱：灰色膠囊 → 動態島展開 ===== */
    .vote-box {
      position: relative;
      overflow: hidden;
      margin: 0 auto;
      border: 2px solid transparent;
      transition:
        width .8s cubic-bezier(.22, 1, .36, 1),
        height .8s cubic-bezier(.22, 1, .36, 1),
        background-color .6s ease,
        border-color .6s ease,
        border-radius .8s cubic-bezier(.22, 1, .36, 1),
        box-shadow .8s ease;
    }
    .vote-box[data-state="closed"] {
      width: min(23rem, 92vw); height: 3.5rem; border-radius: 1.75rem;
      background: #E5E7EB; border-color: #D1D5DB; box-shadow: 0 6px 18px rgba(120,90,110,.2);
    }
    .vote-box[data-state="open"] {
      width: min(34rem, 94vw); height: 11.5rem; border-radius: 2.5rem;
      background: #FFFFFF; border-color: #8FD6B1;
      box-shadow: 0 14px 40px rgba(143,214,177,.6), 0 0 0 6px rgba(143,214,177,.3);
    }
    .vote-box[data-state="voted"] {
      width: min(26rem, 92vw); height: 3.5rem; border-radius: 1.75rem;
      background: #CDEFDD; border-color: #8FD6B1; box-shadow: 0 6px 20px rgba(143,214,177,.5);
    }

    .vlayer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; opacity: 0; pointer-events: none; }
    .vote-box[data-state="closed"] .layer-closed { opacity: 1; pointer-events: auto; }
    .vote-box[data-state="open"]   .layer-open   { opacity: 1; pointer-events: auto; transition-delay: .35s; }
    .vote-box[data-state="voted"]  .layer-voted  { opacity: 1; pointer-events: auto; transition-delay: .2s; }
  </style>
</head>

<body class="min-h-screen">

  <div id="configWarn" class="hidden fixed top-0 inset-x-0 z-50 bg-amber-300 text-[#5B4B63] text-center font-bold py-2 px-3">
    ⚠️ 設定有問題，請編輯 config.js。
  </div>

  <div id="toast" class="hidden fixed top-6 left-1/2 z-50 px-6 py-3 rounded-full bg-white border-2 border-[#E6C7A6] text-lg font-bold shadow-xl max-w-[92vw] text-center"></div>

  <!-- 兩側的可愛小圖樣（由 JS 放入） -->
  <div id="floatHost" class="fixed inset-0 z-0 pointer-events-none overflow-hidden" aria-hidden="true"></div>

  <!-- ================= 確認送出視窗 ================= -->
  <div id="confirmModal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 flex items-center justify-center px-5 bg-[#4A3B52]/45">
      <div class="w-full max-w-md bg-white rounded-[2rem] border-2 border-[#E6C7A6] p-6 shadow-2xl animate-pop-in">
        <h3 class="text-2xl font-black">確定要送出嗎？ 🤔</h3>
        <p class="mt-3 text-[#5B4B63]/70">你選擇的立場</p>
        <p id="cmIsland" class="text-xl font-black"></p>
        <p class="mt-3 text-[#5B4B63]/70">你的理由</p>
        <p id="cmReason" class="mt-1 rounded-2xl bg-[#FFF7EC] border-2 border-[#F3D9C4] px-4 py-3 text-lg break-words max-h-48 overflow-y-auto"></p>
        <p class="mt-4 rounded-2xl bg-[#FFF1D6] border-2 border-[#F2B766] px-4 py-3 font-bold text-[#8A5A12]">
          ⚠️ 每人只能送出一次，送出後不能修改。
        </p>
        <div class="mt-5 grid grid-cols-2 gap-3">
          <button id="cmCancel" type="button" class="rounded-full bg-[#F1ECF4] hover:bg-[#E6DDEC] active:scale-95 transition py-3.5 font-black text-lg">再想想</button>
          <button id="cmOk" type="button" class="rounded-full bg-[#8FD6B1] text-[#3F3447] shadow-md shadow-emerald-300/50 hover:brightness-105 active:scale-95 transition py-3.5 font-black text-lg disabled:opacity-50">確定送出</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 登入頁 ================= -->
  <section id="loginView" class="relative z-10 min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-md animate-pop-in">
      <div class="text-center mb-7 flex flex-col items-center">
        <div data-mascot="96" class="w-24 h-28 animate-bob drop-shadow-lg" aria-hidden="true"></div>
        <h1 class="topicTitle mt-3 text-4xl font-black leading-snug"></h1>
        <p class="mt-3 text-[#5B4B63]/75">請輸入你的資料進入課堂 ✏️</p>
      </div>

      <form id="loginForm" class="bg-white border-2 border-[#E6C7A6] rounded-[2.5rem] p-7 shadow-xl shadow-orange-300/40 space-y-5" autocomplete="off">
        <label class="block">
          <span class="text-[#5B4B63]/70 text-sm ml-2">🏫 班級</span>
          <input id="inClass" list="classList" required placeholder="例：一年一班"
                 class="mt-1 w-full bg-[#FFF7EC] rounded-full px-6 py-4 text-xl outline-none border-2 border-[#F3D9C4] focus:border-[#7DB7E8] transition placeholder-[#5B4B63]/30" />
          <datalist id="classList"></datalist>
        </label>
        <label class="block">
          <span class="text-[#5B4B63]/70 text-sm ml-2">🔢 座號</span>
          <input id="inSeat" type="number" inputmode="numeric" min="1" max="99" required placeholder="例：5"
                 class="mt-1 w-full bg-[#FFF7EC] rounded-full px-6 py-4 text-xl outline-none border-2 border-[#F3D9C4] focus:border-[#7DB7E8] transition placeholder-[#5B4B63]/30" />
        </label>
        <label class="block">
          <span class="text-[#5B4B63]/70 text-sm ml-2">🙋 姓名</span>
          <input id="inName" required maxlength="20" placeholder="例：王小明"
                 class="mt-1 w-full bg-[#FFF7EC] rounded-full px-6 py-4 text-xl outline-none border-2 border-[#F3D9C4] focus:border-[#7DB7E8] transition placeholder-[#5B4B63]/30" />
        </label>
        <button type="submit"
                class="w-full rounded-full bg-[#8FD6B1] text-[#4A3F55] font-black text-xl py-4 shadow-lg shadow-emerald-300/50 hover:brightness-105 active:scale-95 transition">
          進入課堂 🚀
        </button>
      </form>
    </div>
  </section>

  <!-- ================= 主畫面 ================= -->
  <section id="mainView" class="hidden relative z-10 min-h-screen px-4 pt-5 pb-56">
    <div class="max-w-xl mx-auto">

      <!-- 身分列 -->
      <div class="flex items-center justify-between bg-white/90 rounded-full pl-5 pr-2 py-2 border-2 border-[#E6C7A6] shadow-md shadow-orange-300/40">
        <div class="flex items-center gap-2 min-w-0">
          <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-neutral-400 shrink-0"></span>
          <span id="meLabel" class="font-bold truncate"></span>
        </div>
        <button id="logoutBtn" class="rounded-full bg-[#F1ECF4] hover:bg-[#E6DDEC] active:scale-95 transition px-4 py-1.5 text-sm font-bold shrink-0">換人</button>
      </div>

      <!-- 辯題 -->
      <div class="mt-5 flex items-center gap-4 bg-white border-2 border-[#E6C7A6] rounded-[2rem] px-5 py-4 shadow-lg shadow-orange-300/40">
        <div data-mascot="52" class="w-14 h-16 shrink-0 animate-bob" aria-hidden="true"></div>
        <div>
          <p class="text-sm text-[#5B4B63]/60">今天的辯題</p>
          <h2 class="topicTitle text-2xl font-black leading-snug"></h2>
        </div>
      </div>

      <!-- 規則提醒：先想清楚再寫（送出前顯示） -->
      <div id="ruleBanner" class="mt-4 rounded-[1.75rem] border-2 border-[#F2B766] bg-[#FFF1D6] px-5 py-4 shadow-md shadow-orange-300/30">
        <p class="font-black text-lg text-[#8A5A12]">📌 先想一想，再動筆！</p>
        <p class="mt-1 text-[#6B4A12] leading-relaxed">
          每個人<b>只能送出一次</b>理由，送出後<b>不能修改</b>。寫之前先問自己：
        </p>
        <ol class="mt-1 text-[#6B4A12] leading-relaxed list-decimal list-inside">
          <li>我選哪一個立場？為什麼？</li>
          <li>有沒有例子、數據或生活經驗可以支持？</li>
          <li>別人看了，能不能懂我的想法？</li>
        </ol>
      </div>

      <!-- 已送出：顯示我的理由 -->
      <div id="mineCard" class="hidden mt-4 rounded-[1.75rem] border-2 border-[#7CCBA2] bg-[#E3F6EC] px-5 py-4 shadow-md shadow-emerald-300/30 animate-pop-in">
        <p class="font-black text-lg text-[#2F8F63]">✅ 你的理由已送出</p>
        <p class="mt-1">立場：<b id="mineIsland"></b></p>
        <p id="mineReason" class="mt-2 bg-white rounded-2xl px-4 py-3 text-lg break-words"></p>
        <p class="mt-2 text-sm text-[#5B4B63]/70">每人只能送出一次，接下來請聽老師的指示，等待終極投票。</p>
      </div>

      <h3 id="pickHint" class="mt-5 mb-3 text-center text-[#4A3B52]/80 text-lg">選擇你的立場，說出你的理由 👇</h3>

      <!-- 四個動態島 -->
      <div id="islandList" class="space-y-3 mt-3"></div>
    </div>
  </section>

  <!-- ================= 底部：終極投票箱 ================= -->
  <div id="voteDock" class="hidden fixed bottom-4 inset-x-0 z-30 px-3">
    <div id="voteBox" class="vote-box" data-state="closed">

      <!-- 尚未開放：灰色膠囊（Disabled） -->
      <div class="vlayer layer-closed">
        <button id="lockedBtn" type="button" disabled
                class="w-full h-full text-[#8C8497] font-bold text-base cursor-not-allowed">
          投票尚未開放，請聽從老師指示
        </button>
      </div>

      <!-- 已開放：贊成 / 反對 -->
      <div class="vlayer layer-open flex-col gap-3 px-5">
        <p id="voteQuestion" class="text-[#5B4B63] font-bold text-lg"></p>
        <div class="grid grid-cols-2 gap-4 w-full">
          <button id="voteAgree" type="button" disabled
                  class="rounded-full bg-[#8FD6B1] text-[#3F3447] font-black text-2xl py-4 shadow-md shadow-emerald-300/50 active:scale-95 hover:brightness-105 transition disabled:opacity-50">
            👍 贊成
          </button>
          <button id="voteDisagree" type="button" disabled
                  class="rounded-full bg-[#F4A3B6] text-[#3F3447] font-black text-2xl py-4 shadow-md shadow-pink-300/50 active:scale-95 hover:brightness-105 transition disabled:opacity-50">
            👎 反對
          </button>
        </div>
      </div>

      <!-- 已投票：鎖定 -->
      <div class="vlayer layer-voted">
        <p id="votedText" class="font-black text-[#2F6F4F] text-base"></p>
      </div>
    </div>
  </div>

<script>
/* =====================================================================
 * 學生端｜所有議題內容都在 config.js，這裡一般不需要修改
 * ===================================================================== */
const CFG = window.DEBATE_CONFIG;
const PROBLEMS = validateConfig(CFG);
const CONFIGURED = PROBLEMS.length === 0;
const db = CONFIGURED ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY) : null;

const TOPIC_ID = CFG.TOPIC_ID;
const AGREE = CFG.VOTE.agree;
const DISAGREE = CFG.VOTE.disagree;
const MIN_REASON = Math.max(1, CFG.MIN_REASON || 1);
const MAX_REASON = Math.max(MIN_REASON, CFG.MAX_REASON || 120);
const ISLANDS = CFG.ISLANDS.slice(0, 4);

const $ = (id) => document.getElementById(id);

/* ---------- 狀態 ---------- */
let me = null;              // { cls, seat, name }
let votingOpen = false;
let myVote = null;          // AGREE | DISAGREE | null
let mySub = null;           // { island, reason } | null：我已送出的理由
let pending = null;         // 等待確認送出的內容
let statusChannel = null;
let pollTimer = null;
let sending = false;

/* ---------- 小工具 ---------- */
function toast(msg, ms = 2400) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden', 'animate-toast-in');
  void t.offsetWidth;
  t.classList.add('animate-toast-in');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}

function setConn(state) {
  const dot = $('connDot');
  dot.className = 'w-2.5 h-2.5 rounded-full shrink-0';
  if (state === 'ok')       dot.classList.add('bg-emerald-400', 'animate-breathe');
  else if (state === 'err') dot.classList.add('bg-rose-400');
  else                      dot.classList.add('bg-neutral-400');
}

/* ---------- 登入 ---------- */
$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const cls = $('inClass').value.trim();
  const seat = parseInt($('inSeat').value, 10);
  const name = $('inName').value.trim();
  if (!cls || !name || !Number.isInteger(seat) || seat < 1) { toast('請完整填寫班級、座號、姓名'); return; }
  me = { cls, seat, name };
  localStorage.setItem('debate_student', JSON.stringify(me));
  enterMain();
});

$('logoutBtn').addEventListener('click', () => {
  if (statusChannel && db) db.removeChannel(statusChannel);
  statusChannel = null;
  clearInterval(pollTimer);
  localStorage.removeItem('debate_student');
  me = null; myVote = null; mySub = null; votingOpen = false;
  closeConfirm();
  $('mainView').classList.add('hidden');
  $('voteDock').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  setConn('off');
});

/* ---------- 四個動態島 ---------- */
function buildIslands() {
  const host = $('islandList');
  host.innerHTML = '';
  ISLANDS.forEach((isl, idx) => {
    const el = document.createElement('div');
    el.className = 's-island animate-pop-in';
    el.style.animationDelay = (idx * 90) + 'ms';
    el.dataset.key = isl.key;
    el.style.setProperty('--accent', isl.accent);
    el.style.setProperty('--accent-glow', isl.accent + '66');

    el.innerHTML = `
      <button type="button" class="head w-full h-16 flex items-center gap-4 px-5 text-left">
        <span class="text-3xl leading-none">${esc(isl.emoji)}</span>
        <span class="font-black text-2xl" style="color:${esc(isl.ink)}">${esc(isl.key)}</span>
        <span class="tick hidden ml-1 text-2xl">✅</span>
        <svg class="chev ml-auto w-6 h-6 text-[#5B4B63]/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="s-body">
        <div class="s-inner">
          <div class="px-5 pb-5 pt-1">
            <p class="mb-2 text-sm font-bold" style="color:${esc(isl.ink)}">💭 想清楚了嗎？${MIN_REASON > 1 ? `理由至少 ${MIN_REASON} 個字，` : ''}每人只能送出一次，送出後不能修改喔！</p>
            <textarea rows="3" maxlength="${MAX_REASON}" placeholder="${esc(isl.hint || '')}"
              class="w-full resize-none rounded-3xl bg-[#FFF7EC] px-5 py-4 text-lg outline-none border-2 transition placeholder-[#5B4B63]/30"
              style="border-color:${esc(isl.accent)}88; color:#4A3F55"></textarea>
            <div class="mt-3 flex items-center justify-between">
              <span class="counter text-[#5B4B63]/50 text-sm tabular-nums">0 / ${MAX_REASON}</span>
              <div class="flex gap-2">
                <button type="button" class="cancel rounded-full bg-[#F1ECF4] hover:bg-[#E6DDEC] active:scale-95 transition px-5 py-2.5 font-bold">取消</button>
                <button type="button" class="send rounded-full px-7 py-2.5 font-black text-[#3F3447] shadow-md active:scale-95 hover:brightness-105 transition disabled:opacity-50"
                        style="background:${esc(isl.accent)}">檢查並送出</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    const ta = el.querySelector('textarea');
    const counter = el.querySelector('.counter');
    ta.addEventListener('input', () => { counter.textContent = `${ta.value.length} / ${MAX_REASON}`; });

    el.querySelector('.head').addEventListener('click', () => toggleIsland(el));
    el.querySelector('.cancel').addEventListener('click', () => el.classList.remove('open'));
    el.querySelector('.send').addEventListener('click', () => askConfirm(isl, el));

    host.appendChild(el);
  });
}

function toggleIsland(el) {
  if (mySub) { toast('你已經送出過理由囉，每人只能送出一次'); return; }
  const willOpen = !el.classList.contains('open');
  document.querySelectorAll('.s-island').forEach((x) => x.classList.remove('open'));
  if (willOpen) {
    el.classList.add('open');
    setTimeout(() => el.querySelector('textarea').focus({ preventScroll: true }), 450);
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
  }
}

/* 依照 mySub 更新畫面：已送出就鎖定四個島、顯示我的理由 */
function renderMine() {
  const locked = !!mySub;
  $('mineCard').classList.toggle('hidden', !locked);
  $('ruleBanner').classList.toggle('hidden', locked);
  $('pickHint').classList.toggle('hidden', locked);

  if (locked) {
    const isl = ISLANDS.find((i) => i.key === mySub.island);
    $('mineIsland').textContent = (isl ? isl.emoji + ' ' : '') + mySub.island;
    $('mineReason').textContent = mySub.reason;
  }

  document.querySelectorAll('.s-island').forEach((el) => {
    if (locked) el.classList.remove('open');
    el.classList.toggle('locked', locked);
    el.classList.toggle('chosen', locked && el.dataset.key === mySub.island);
    el.querySelector('.tick').classList.toggle('hidden', !(locked && el.dataset.key === mySub.island));
  });
}

/* ---------- 送出理由（先確認，再寫入；每人只能一次） ---------- */
function askConfirm(isl, el) {
  if (mySub) { toast('你已經送出過理由囉，每人只能送出一次'); return; }
  const ta = el.querySelector('textarea');
  const reason = ta.value.trim();
  if (!reason) { toast('請先輸入理由'); ta.focus(); return; }
  if (reason.length < MIN_REASON) {
    toast(`理由至少寫 ${MIN_REASON} 個字，再想完整一點喔`);
    ta.focus();
    return;
  }
  if (!db) { toast('設定有問題，請老師檢查 config.js'); return; }

  pending = { isl, el, reason };
  $('cmIsland').textContent = `${isl.emoji} ${isl.key}`;
  $('cmReason').textContent = reason;
  $('confirmModal').classList.remove('hidden');
}

function closeConfirm() {
  $('confirmModal').classList.add('hidden');
  pending = null;
}

async function doSubmit() {
  if (!pending || sending || !db) return;
  const { isl, el, reason } = pending;
  const okBtn = $('cmOk');

  sending = true;
  okBtn.disabled = true;
  okBtn.textContent = '送出中…';

  const { error } = await db.from('arguments').insert({
    topic: TOPIC_ID,
    class_name: me.cls,
    seat: me.seat,
    name: me.name,
    island: isl.key,
    reason,
  });

  sending = false;
  okBtn.disabled = false;
  okBtn.textContent = '確定送出';
  closeConfirm();

  if (error) {
    if (error.code === '23505') {          // 唯一鍵衝突：這個座號已經送過了
      await syncMine();
      toast('你已經送出過理由了，每人只能送一次', 3200);
      return;
    }
    toast('送出失敗：' + explainErr(error), 4200);
    return;
  }

  mySub = { island: isl.key, reason };
  el.querySelector('textarea').value = '';
  el.querySelector('.counter').textContent = `0 / ${MAX_REASON}`;
  renderMine();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast(`✅ 已送出到「${isl.key}」`);
}

$('cmCancel').addEventListener('click', closeConfirm);
$('cmOk').addEventListener('click', doSubmit);

/* ---------- 終極投票箱 ---------- */
function applyVoteState() {
  const box = $('voteBox');
  const state = myVote ? 'voted' : (votingOpen ? 'open' : 'closed');
  box.dataset.state = state;

  const canVote = state === 'open';
  $('voteAgree').disabled = !canVote;
  $('voteDisagree').disabled = !canVote;
  $('lockedBtn').disabled = true; // 永遠不可點

  if (state === 'voted') {
    $('votedText').textContent = `✓ 你已投下「${myVote}」，感謝參與`;
  }
}

function setVotingOpen(v) {
  const changed = votingOpen !== v;
  votingOpen = v;
  applyVoteState();
  if (changed && v && !myVote) toast('🗳️ 終極投票開放了！', 2800);
}

async function castVote(choice) {
  if (myVote || !votingOpen || !db) return;
  $('voteAgree').disabled = true;
  $('voteDisagree').disabled = true;

  const { error } = await db.from('votes').insert({
    topic: TOPIC_ID, class_name: me.cls, seat: me.seat, name: me.name, choice,
  });

  if (error) {
    if (error.code === '23505') {            // 已投過（唯一鍵衝突）
      await syncMine();
      toast('你已經投過票了');
      return;
    }
    applyVoteState();
    toast('投票失敗：' + explainErr(error), 4200);
    return;
  }

  myVote = choice;
  applyVoteState();
}

$('voteAgree').addEventListener('click', () => castVote(AGREE));
$('voteDisagree').addEventListener('click', () => castVote(DISAGREE));

/* 以資料庫為準，同步「我送出過的理由」與「我投過的票」。
   老師清除本班資料後，這裡會讓學生自動解除鎖定、可以重新填寫。 */
async function syncMine() {
  if (!db || !me) return;
  const [a, v] = await Promise.all([
    db.from('arguments').select('island,reason')
      .eq('topic', TOPIC_ID).eq('class_name', me.cls).eq('seat', me.seat)
      .order('created_at', { ascending: true }).limit(1),
    db.from('votes').select('choice')
      .eq('topic', TOPIC_ID).eq('class_name', me.cls).eq('seat', me.seat)
      .order('created_at', { ascending: true }).limit(1),
  ]);
  if (!a.error) mySub = (a.data && a.data[0]) ? { island: a.data[0].island, reason: a.data[0].reason } : null;
  if (!v.error) myVote = (v.data && v.data[0]) ? v.data[0].choice : null;
  renderMine();
  applyVoteState();
}

async function fetchStatus() {
  if (!db || !me) return;
  const { data, error } = await db.from('system_status').select('voting_open')
    .eq('topic', TOPIC_ID).eq('class_name', me.cls).maybeSingle();
  if (!error) setVotingOpen(!!(data && data.voting_open));
}

function subscribeStatus() {
  if (!db) return;
  if (statusChannel) db.removeChannel(statusChannel);
  const cls = me.cls;

  statusChannel = db.channel('student-' + Date.now())
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'system_status', filter: `class_name=eq.${cls}` },
      (p) => {
        const row = p.new;
        if (row && me && row.topic === TOPIC_ID && row.class_name === me.cls) {
          setVotingOpen(!!row.voting_open);
          syncMine();   // 老師清除資料時也會更新這張表，順便重新確認我的狀態
        }
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { setConn('ok'); fetchStatus(); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setConn('err');
      else if (status === 'CLOSED') setConn('off');
    });

  // 保險機制：平板休眠或網路中斷後，定期補抓狀態
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { fetchStatus(); syncMine(); }, 10000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && me) { fetchStatus(); syncMine(); }
});

/* ---------- 進入主畫面 ---------- */
async function enterMain() {
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  $('voteDock').classList.remove('hidden');
  $('meLabel').textContent = `${me.cls}　${me.seat} 號　${me.name}`;

  buildIslands();
  votingOpen = false;
  myVote = null;
  mySub = null;
  renderMine();
  applyVoteState();

  if (!db) return;
  await syncMine();
  await fetchStatus();
  subscribeStatus();
}

/* ---------- 初始化 ---------- */
function init() {
  document.title = topicText() + '｜學生端';
  document.querySelectorAll('.topicTitle').forEach(renderTopicInto);
  renderMascots();
  $('voteQuestion').textContent = CFG.VOTE.question || '🗳️ 終極投票';
  $('voteAgree').textContent = `${CFG.VOTE.agreeEmoji || ''} ${AGREE}`.trim();
  $('voteDisagree').textContent = `${CFG.VOTE.disagreeEmoji || ''} ${DISAGREE}`.trim();
  $('classList').innerHTML = classOptionsHTML();
  if (!CONFIGURED) showConfigProblems(PROBLEMS);

  renderFloaters((CFG.FLOATERS || {}).student);

  try {
    const saved = JSON.parse(localStorage.getItem('debate_student') || 'null');
    if (saved && saved.cls && saved.seat && saved.name) {
      me = saved;
      enterMain();
      return;
    }
  } catch (_) {}
  applyVoteState();
}

init();
</script>
